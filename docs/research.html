<script>
(() => {
  const doc = document.getElementById("doc"), toc = document.getElementById("toc");
  const slug = (s) => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  fetch("RESEARCH.md").then((r) => r.text()).then((md) => {
    doc.innerHTML = marked.parse(md);
    doc.querySelectorAll("h1,h2,h3").forEach((h) => { h.id = slug(h.textContent); });
    // the sidebar replaces the in-document contents list
    const contents = document.getElementById("contents");
    if (contents) { const list = contents.nextElementSibling; if (list) list.remove(); contents.nextElementSibling?.tagName === "HR" && contents.nextElementSibling.remove(); contents.remove(); }
    const h2s = [...doc.querySelectorAll("h2")];
    h2s.forEach((h) => { const a = document.createElement("a"); a.href = "#" + h.id; a.textContent = h.textContent; toc.appendChild(a); });
    const links = [...toc.querySelectorAll("a")];
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.hash === "#" + e.target.id)); });
    }, { rootMargin: "-80px 0px -70% 0px" });
    h2s.forEach((h) => io.observe(h));
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  }).catch(() => {
    doc.innerHTML = '<p class="loading">Could not load the report. <a href="https://github.com/prashantbhandary/nepse-quant-desk/blob/main/docs/RESEARCH.md">Read it on GitHub</a>.</p>';
  });
})();
</script>
